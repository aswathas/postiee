name: release

# Builds cross-platform binaries on a tag and publishes them as a GitHub
# release. install.sh and install.ps1 download from that release, so tagging is
# what makes the installers work for anyone.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          check-latest: true

      - name: Verify the build
        run: |
          go build ./...
          go vet ./...
          go test -count=1 ./...

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          # module path and binary name are stable; VERSION rides in via ldflags
          # only when the version package exposes it, so build plainly.
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/postiee_${os}_${arch}"
            [ "$os" = "windows" ] && out="${out}.exe"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w" \
              -o "$out" \
              ./cmd/postiee
          done

      - name: Package archives
        run: |
          set -eu
          cd dist
          for f in postiee_*; do
            case "$f" in
              *.exe) base="${f%.exe}" ;;
              *)     base="$f" ;;
            esac
            tar -czf "${base}.tar.gz" "$f"
          done
          # Windows users get a zip.
          for f in postiee_windows_*.exe; do
            [ -e "$f" ] || continue
            base="${f%.exe}"
            zip -q "${base}.zip" "$f"
          done
          rm -f postiee_*.*/ 2>/dev/null || true
          ls -la

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
          body: |
            ## Install

            **macOS / Linux**
            ```sh
            curl -fsSL https://raw.githubusercontent.com/aswathas/postiee/main/install.sh | sh
            ```

            **Windows (PowerShell)**
            ```powershell
            irm https://raw.githubusercontent.com/aswathas/postiee/main/install.ps1 | iex
            ```

            Then create a LinkedIn app, write your credentials, and log in:
            ```sh
            postiee auth login --port 8085
            ```

            Full setup: https://github.com/aswathas/postiee#setup